services:
  mariadb:
    build: requirements/mariadb/
    container_name: mariadb
    image: mariadb:inception
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_network

  wordpress:
    build: requirements/wordpress/
    container_name: wordpress
    image: wordpress:inception
    restart: always
    env_file:
      - .env
    secrets:
      - wp_user_password
      - wp_admin_password
      - db_password
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception_network
    depends_on:
      - mariadb

  nginx:
    build: requirements/nginx
    container_name: nginx
    image: nginx:inception
    restart: always
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - wp_data:/var/www/wordpress  
    networks:
      - inception_network
    depends_on:
      - wordpress

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

networks:
  inception_network:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
